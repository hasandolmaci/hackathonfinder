<event-page :event='{&quot;id&quot;: 417, &quot;organization_id&quot;: 162, &quot;slug&quot;: &quot;underground-innovation-hackathon&quot;, &quot;name&quot;: &quot;Underground Innovation Hackathon&quot;, &quot;description&quot;: &quot;&lt;h3&gt;&lt;strong&gt;About the event&lt;/strong&gt;&lt;/h3&gt;&lt;h4&gt;&lt;strong&gt;Underground Innovation Hackathon&lt;/strong&gt;&lt;br&gt;&lt;i&gt;Estonian Dual Use &amp;amp; Circular Future&lt;/i&gt;&amp;nbsp;&lt;/h4&gt;&lt;p&gt;Brings together international teams to develop technically feasible, scalable and economically viable solutions for the future use of underground space.&lt;/p&gt;&lt;p&gt;Teams will work with real underground infrastructure opportunities in Estonia and explore how underground environments can support energy resilience, circular economy &amp;amp; resource use, critical infrastructure and new industrial applications.&lt;/p&gt;&lt;p&gt;Only 12 teams will be selected.&lt;/p&gt;&lt;p&gt;Applications are reviewed on a rolling basis. Strong teams and ideas can be selected before the final deadline.&lt;/p&gt;&lt;h3&gt;Why join?&lt;/h3&gt;&lt;p&gt;This is not just an idea competition. You will work on a real underground infrastructure case in Estonia and develop a solution that can move beyond the hackathon.&lt;/p&gt;&lt;p&gt;Participants will get:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;access to technical, business and industry experts&lt;/li&gt;&lt;li&gt;mentoring during the development sprint&lt;/li&gt;&lt;li&gt;support in validating technical and commercial feasibility&lt;/li&gt;&lt;li&gt;connections with potential customers, partners, research organisations and public sector experts&lt;/li&gt;&lt;li&gt;visibility among decision-makers and international stakeholders&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;For the strongest teams, the hackathon is also a fast track into Estonia:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;showcase opportunities at the Underground Innovation Conference&lt;/li&gt;&lt;li&gt;a dedicated EIS contact point and access to Estonia’s startup and innovation ecosystem&lt;/li&gt;&lt;li&gt;support with relevant funding opportunities and market entry&lt;/li&gt;&lt;li&gt;targeted matchmaking with companies, investors, regulators and pilot partners&lt;/li&gt;&lt;li&gt;a pathway towards proof of concept, validation or a real pilot&lt;/li&gt;&lt;li&gt;follow-up support after the hackathon to turn the concept into concrete next steps&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;The goal is not just to win the hackathon, but to move towards a real partnership, pilot, investment or market entry in Estonia.&lt;/p&gt;&lt;h2&gt;Apply with a team&lt;/h2&gt;&lt;p&gt;Teams must have 2 - 6 members and an initial idea when applying.&lt;/p&gt;&quot;, &quot;image&quot;: &quot;events/417/IFV763C2GfiInpdomCjkS0uhLDvSNc0TKxuGaAu4.jpeg&quot;, &quot;status&quot;: 1, &quot;submissions_count&quot;: null, &quot;public_comments_count&quot;: null, &quot;analytics_type&quot;: 1, &quot;analytics_details&quot;: {&quot;ga4_id&quot;: null, &quot;ga_event_participant_submitted&quot;: null, &quot;ga_event_submitted&quot;: null, &quot;fb_id&quot;: null, &quot;fb_event_participant_submitted&quot;: null, &quot;fb_event_submitted&quot;: null}, &quot;start_date&quot;: &quot;2098-09-04T12:42:56.000000Z&quot;, &quot;end_date&quot;: &quot;2098-12-11T07:00:00.000000Z&quot;, &quot;created_at&quot;: &quot;2098-08-19T12:42:56.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-11-09T11:18:17.000000Z&quot;, &quot;deleted_at&quot;: null, &quot;phases&quot;: [{&quot;id&quot;: 3592, &quot;event_id&quot;: 417, &quot;name&quot;: &quot;✅ Applications open. Apply early - teams are selected in two priority rounds and applications close once all places are filled.&quot;, &quot;start_date&quot;: &quot;2098-10-30T09:11:11.000000Z&quot;, &quot;end_date&quot;: null, &quot;settings&quot;: 1904, &quot;created_at&quot;: &quot;2098-08-19T12:42:56.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-10-29T18:57:54.000000Z&quot;, &quot;deleted_at&quot;: null, &quot;sho in_team_permission&quot;: false, &quot;countdown&quot;: true}], &quot;topics&quot;: [{&quot;id&quot;: 2358, &quot;event_id&quot;: 417, &quot;position&quot;: 0, &quot;name&quot;: &quot;Challenge 1: 🛡️ Critical Infrastructure &amp; Novel Business Models&quot;, &quot;slug&quot;: &quot;critical-autonomous-infrastructure&quot;, &quot;description&quot;: &quot;&lt;h4&gt;&lt;i&gt;How can underground space strengthen the resilience and autonomy of society and industry?&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;The challenge is to leverage the unique physical properties of subterranean environments. We are looking for solutions that provide critical stability and protection, or that create a distinct technical and economic advantage over above-ground alternatives.&lt;/p&gt;&lt;p&gt;Possible directions:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Energy generation, storage, and transmission&lt;/li&gt;&lt;li&gt;Heating and cooling systems&lt;/li&gt;&lt;li&gt;Defense, security, and civil protection&lt;/li&gt;&lt;li&gt;Secure industrial production, storage, and logistics&lt;/li&gt;&lt;li&gt;Energy-intensive industrial processes&lt;/li&gt;&lt;li&gt;Healthcare facilities and essential services&lt;/li&gt;&lt;li&gt;Multi-purpose spatial integration (e.g., combining energy, storage, and consumption)&lt;/li&gt;&lt;li&gt;Autonomous underground industrial systems&lt;/li&gt;&lt;li&gt;Secure data centers and High-Performance Computing (HPC)&lt;/li&gt;&lt;li&gt;Controlled-environment biotechnology and food production&lt;/li&gt;&lt;/ul&gt;&quot;, &quot;image&quot;: &quot;topics/2358/50aF34WwWw3w0oPzDAVfiKKZTohti8vu7zLo5Hie.jpeg&quot;, &quot;public_comments_count&quot;: null, &quot;created_at&quot;: &quot;2098-08-19T12:42:56.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-10-29T14:50:40.000000Z&quot;, &quot;deleted_at&quot;: null}, {&quot;id&quot;: 2359, &quot;event_id&quot;: 417, &quot;position&quot;: 0, &quot;name&quot;: &quot;Challenge 2: 🏗️ Next-Generation Engineering &amp; Construction&quot;, &quot;slug&quot;: &quot;next-generation-engineering-construction&quot;, &quot;description&quot;: &quot;&lt;h4&gt;&lt;i&gt;How can we expand our knowledge and capabilities to build underground infrastructure faster, safer, and smarter?&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;The challenge is to modernize the way we explore, model, and excavate. We are seeking technological and methodological leaps that reduce the cost, uncertainty, and environmental impact of subterranean construction.&lt;/p&gt;&lt;p&gt;Possible directions:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Advanced underground surveying and mapping&lt;/li&gt;&lt;li&gt;Geological data analysis and interpretation&lt;/li&gt;&lt;li&gt;AI-driven 3D geological modeling and visualization&lt;/li&gt;&lt;li&gt;Autonomous excavation and robotic tunneling technologies&lt;/li&gt;&lt;li&gt;Advanced remote sensing and non-destructive testing&lt;/li&gt;&lt;li&gt;Digital twins for subterranean environments&lt;/li&gt;&lt;li&gt;Groundwater management and hydrological impact mitigation&lt;/li&gt;&lt;li&gt;Sustainable construction materials for underground support&lt;/li&gt;&lt;li&gt;Seismic monitoring and real-time hazard prediction&lt;/li&gt;&lt;li&gt;Smart ventilation and environmental control systems&lt;/li&gt;&lt;li&gt;Standardization and open platforms for geotechnical data sharing&lt;/li&gt;&lt;/ul&gt;&quot;, &quot;image&quot;: &quot;topics/2359/0gOmeROhxrj8ATTcyAE65Zl2s02qIZnx3rKU5ZtU.jpeg&quot;, &quot;public_comments_count&quot;: null, &quot;created_at&quot;: &quot;2098-08-19T12:42:56.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-10-29T14:51:34.000000Z&quot;, &quot;deleted_at&quot;: null}, {&quot;id&quot;: 2370, &quot;event_id&quot;: 417, &quot;position&quot;: 1, &quot;name&quot;: &quot;Challenge 3: 💶 Viability, Policy &amp; Financial Innovation&quot;, &quot;slug&quot;: &quot;policy-finance-innovation&quot;, &quot;description&quot;: &quot;&lt;h4&gt;&lt;i&gt;How can we remove the barriers that prevent underground projects from becoming investable and scalable?&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;The challenge is to design frameworks that make technically strong underground solutions easier to finance, permit, and implement. We need innovative models that align public interest with private capital and de-risk early-stage development.&lt;/p&gt;&lt;p&gt;Possible directions:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Multi-depth spatial planning and 3D subsurface allocation frameworks&lt;/li&gt;&lt;li&gt;Navigating and modernizing underground property rights and jurisdictions&lt;/li&gt;&lt;li&gt;Green financing and ESG-aligned funding structures&lt;/li&gt;&lt;li&gt;De-risking models for early-stage geological exploration&lt;/li&gt;&lt;li&gt;Parametric insurance and novel risk management for deep-subterranean projects&lt;/li&gt;&lt;li&gt;Incentive models for Public-Private Partnerships (PPP)&lt;/li&gt;&lt;li&gt;Monetization strategies for shared deep-underground infrastructure&lt;/li&gt;&lt;li&gt;Digital economic modeling and decision-making tools for investors and regulators&lt;/li&gt;&lt;/ul&gt;&quot;, &quot;image&quot;: &quot;topics/2370/7O6Als6fw61EINrdPOhzZwsOMvdCWJJoq7Vq7Ff3.jpeg&quot;, &quot;public_comments_count&quot;: null, &quot;created_at&quot;: &quot;2098-09-07T15:27:31.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-10-29T14:53:24.000000Z&quot;, &quot;deleted_at&quot;: null}], &quot;expertises&quot;: [{&quot;id&quot;: 2466, &quot;title&quot;: &quot;geotechnical and underground engineering&quot;, &quot;active&quot;: 1, &quot;event_id&quot;: 417, &quot;pivot&quot;: {&quot;event_id&quot;: 417, &quot;expertise_id&quot;: 2466}}], &quot;event_info_tabs&quot;: [{&quot;id&quot;: 936, &quot;event_id&quot;: 417, &quot;position&quot;: 2, &quot;title&quot;: &quot;Challenges&quot;, &quot;slug&quot;: &quot;challenges&quot;, &quot;content&quot;: &quot;&lt;h3&gt;&lt;i&gt;What can we realistically build underground that creates value above ground?&lt;/i&gt;&lt;/h3&gt;&lt;p&gt;Underground Innovation Hackathon brings international teams together to develop technically feasible, scalable and economically viable solutions for underground space.&lt;/p&gt;&lt;h4&gt;&lt;strong&gt;🛡️ Challenge 1: &lt;/strong&gt;&lt;a href=\&quot;https://eventornado.com/event/underground-innovation-hackathon/topic/critical-autonomous-infrastructure\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;&lt;strong&gt;Critical Infrastructure &amp;amp; Novel Business Models&lt;/strong&gt;&lt;/a&gt;&lt;br&gt;&lt;i&gt;How can underground space strengthen the resilience and autonomy of society and industry?&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;The challenge is to leverage the unique physical properties of subterranean environments. We are looking for solutions that provide critical stability and protection, or that create a distinct technical and economic advantage over above-ground alternatives. &lt;a href=\&quot;https://eventornado.com/event/underground-innovation-hackathon/topic/critical-infrastructure-business-models\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Read more…&lt;/a&gt;&lt;/p&gt;&lt;h4&gt;&lt;strong&gt;🏗️ Challenge 2: &lt;/strong&gt;&lt;a href=\&quot;https://eventornado.com/event/underground-innovation-hackathon/topic/next-generation-engineering-construction\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;&lt;strong&gt;Next-Generation Engineering &amp;amp; Construction&lt;/strong&gt;&lt;/a&gt;&lt;br&gt;&lt;i&gt;How can we expand our knowledge and capabilities to build underground infrastructure faster, safer, and smarter?&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;The challenge is to modernize the way we explore, model, and excavate. We are seeking technological and methodological leaps that reduce the cost, uncertainty, and environmental impact of subterranean construction. &lt;a href=\&quot;https://eventornado.com/event/underground-innovation-hackathon/topic/next-generation-engineering-construction\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Read more…&lt;/a&gt;&lt;/p&gt;&lt;h4&gt;&lt;strong&gt;💶 Challenge 3: &lt;/strong&gt;&lt;a href=\&quot;https://eventornado.com/event/underground-innovation-hackathon/topic/policy-finance-innovation#home\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;&lt;strong&gt;Viability, Policy &amp;amp; Financial Innovation&lt;/strong&gt;&lt;/a&gt;&lt;br&gt;&lt;i&gt;How can we remove the barriers that prevent underground projects from becoming investable and scalable?&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;The challenge is to design frameworks that make technically strong underground solutions easier to finance, permit, and implement. We need innovative models that align public interest with private capital and de-risk early-stage development. &lt;a href=\&quot;https://eventornado.com/event/underground-innovation-hackathon/topic/policy-finance-innovation#home\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Read more…&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&quot;, &quot;icon&quot;: &quot;lightbulb&quot;, &quot;status&quot;: 1, &quot;created_at&quot;: &quot;2098-09-07T14:57:12.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-11-04T09:14:33.000000Z&quot;, &quot;deleted_at&quot;: null}, {&quot;id&quot;: 937, &quot;event_id&quot;: 417, &quot;position&quot;: 3, &quot;title&quot;: &quot;Timeline&quot;, &quot;slug&quot;: &quot;timeline&quot;, &quot;content&quot;: &quot;&lt;h3&gt;&lt;strong&gt;Your journey from application to final pitch&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;✅ 30 October: Applications open&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Apply early. Teams are selected in two priority rounds and applications close once all places are filled.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;⭕ 8 November: Priority round 1 closes&lt;/strong&gt;&lt;br&gt;First teams are selected.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;⭕ 15 November: Priority round 2 closes&lt;/strong&gt;&lt;br&gt;Second selection round. If places remain, applications stay open.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;⭕ 23 November: Final deadline&lt;/strong&gt;&lt;br&gt;Final applications accepted only if places are still available.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;🚩 24 November: Teams and mentors confirmed&lt;/strong&gt;&lt;br&gt;Final teams are confirmed and matched with mentors.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;🏁 1 December: Online kick-off&lt;/strong&gt;&lt;br&gt;Receive the challenge brief, technical background, working instructions and pitch criteria.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;🚩 3 December: Checkpoint 1&lt;/strong&gt;&lt;br&gt;Problem definition and solution concept.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;🚩 7 December: Checkpoint 2&lt;/strong&gt;&lt;br&gt;Business model and feasibility.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;🗣️ 10 December: Final pitches&lt;/strong&gt;&lt;br&gt;Present your concept to the jury. Winners are announced the same day.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;🚀 From 11 December: From winners to pilots&lt;/strong&gt;&lt;br&gt;Selected teams continue towards partnerships, pilots, funding and market entry in Estonia.&lt;/p&gt;&quot;, &quot;icon&quot;: &quot;calendar-alt&quot;, &quot;status&quot;: 1, &quot;created_at&quot;: &quot;2098-09-07T14:58:35.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-10-30T09:45:38.000000Z&quot;, &quot;deleted_at&quot;: null}, {&quot;id&quot;: 938, &quot;event_id&quot;: 417, &quot;position&quot;: 4, &quot;title&quot;: &quot;Participation&quot;, &quot;slug&quot;: &quot;participation&quot;, &quot;content&quot;: &quot;&lt;h3&gt;&lt;strong&gt;Bring your team and an initial idea!&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;We welcome multidisciplinary teams from universities, research organisations, start-ups, companies and independent expert networks.&lt;/p&gt;&lt;p&gt;Relevant expertise includes engineering, energy, underground construction, architecture, data centres, AI, circular economy, biotechnology, logistics, defence, business development and investment.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;What you need to apply&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;A team of 2 - 6 people.&lt;/li&gt;&lt;li&gt;An initial idea addressing at least one hackathon challenge.&lt;/li&gt;&lt;li&gt;Availability for the online kick-off, mentoring sprint and final event.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Applications are reviewed on a rolling basis. Strong teams and ideas can be selected before the final deadline.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;What you will gain&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Access to technical and business experts.&lt;/li&gt;&lt;li&gt;Mentoring during the development sprint.&lt;/li&gt;&lt;li&gt;Support in testing your idea’s technical and commercial feasibility.&lt;/li&gt;&lt;li&gt;Connections with potential industry, technology and research partners.&lt;/li&gt;&lt;li&gt;Visibility among international experts, companies and decision-makers.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;A pathway beyond the hackathon towards validation, pilots, funding and real business opportunities in Estonia.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;What you will deliver&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;Develop your initial idea into a credible concept and present it in a &lt;strong&gt;10-minute final pitch&lt;/strong&gt;, covering:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;The problem and proposed solution.&lt;/li&gt;&lt;li&gt;Technical feasibility.&lt;/li&gt;&lt;li&gt;Target users or customers.&lt;/li&gt;&lt;li&gt;Business model.&lt;/li&gt;&lt;li&gt;Environmental and resource impact.&lt;/li&gt;&lt;li&gt;Scalability.&lt;/li&gt;&lt;li&gt;Indicative economics and payback.&lt;/li&gt;&lt;li&gt;Implementation roadmap.&lt;/li&gt;&lt;li&gt;A visual model, diagram, system architecture or spatial concept.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;&lt;strong&gt;What happens to the best teams&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;For the strongest solutions, the final pitch is only the beginning.&lt;/p&gt;&lt;p&gt;Selected teams will receive a &lt;strong&gt;fast track into the Estonian innovation ecosystem&lt;/strong&gt;, including:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;An opportunity to present at the &lt;strong&gt;Underground Innovation Conference&lt;/strong&gt;.&lt;/li&gt;&lt;li&gt;A dedicated contact point at &lt;strong&gt;EIS - Enterprise Estonia&lt;/strong&gt; for post-hackathon support.&lt;/li&gt;&lt;li&gt;Matchmaking with relevant companies, potential customers, pilot partners, research organisations, technology providers, regulators and investors.&lt;/li&gt;&lt;li&gt;Guidance on relevant Estonian and European funding opportunities.&lt;/li&gt;&lt;li&gt;Support in moving towards proof of concept, validation or a real pilot.&lt;/li&gt;&lt;li&gt;Access to relevant &lt;strong&gt;Startup Estonia, Invest Estonia and wider Estonian innovation ecosystem&lt;/strong&gt; networks.&lt;/li&gt;&lt;li&gt;Follow-up support aimed at turning the strongest concepts into real projects and business opportunities.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;The goal is not simply to win the hackathon. The goal is to move from &lt;strong&gt;idea → validation → pitch → partners → pilot → real business&lt;/strong&gt;.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;Ready to join?&lt;/strong&gt;&lt;/h3&gt;&lt;h3&gt;Apply with your team through Eventornado.&lt;br&gt;Click the REGISTER button in the top-right corner ⬆️&lt;/h3&gt;&quot;, &quot;icon&quot;: &quot;user-friends&quot;, &quot;status&quot;: 1, &quot;created_at&quot;: &quot;2098-09-07T14:59:55.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-10-30T09:45:38.000000Z&quot;, &quot;deleted_at&quot;: null}, {&quot;id&quot;: 939, &quot;event_id&quot;: 417, &quot;position&quot;: 5, &quot;title&quot;: &quot;Mentors&quot;, &quot;slug&quot;: &quot;mentors&quot;, &quot;content&quot;: &quot;&lt;h3&gt;&lt;strong&gt;Help teams turn ambitious underground concepts into feasible solutions&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;We are looking for mentors who can help participating teams test assumptions, assess feasibility and strengthen their business cases.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;Where your expertise can help&lt;/strong&gt;&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Underground infrastructure and industrial engineering.&lt;/li&gt;&lt;li&gt;Energy, heat and storage.&lt;/li&gt;&lt;li&gt;Circular economy and resource use.&lt;/li&gt;&lt;li&gt;Data centres, HPC, AI and digital twins.&lt;/li&gt;&lt;li&gt;Biotechnology.&lt;/li&gt;&lt;li&gt;Architecture and spatial planning.&lt;/li&gt;&lt;li&gt;Business models and investment.&lt;/li&gt;&lt;li&gt;Regulation and financing.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Additional specialist mentors will be recruited according to the needs of the selected teams.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;What participation involves&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;Mentors are matched with teams in late November. You should be available for the early December online kick-off and selected online mentoring sessions during the following week’s sprint.&lt;/p&gt;&lt;h3&gt;To become a mentor please register &lt;a href=\&quot;https://eventornado.com/event/underground-innovation-hackathon/mentors/apply\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;here&lt;/a&gt;&lt;/h3&gt;&quot;, &quot;icon&quot;: &quot;compass&quot;, &quot;status&quot;: 1, &quot;created_at&quot;: &quot;2098-09-07T15:07:31.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-10-30T09:48:06.000000Z&quot;, &quot;deleted_at&quot;: null}, {&quot;id&quot;: 940, &quot;event_id&quot;: 417, &quot;position&quot;: 6, &quot;title&quot;: &quot;Partners&quot;, &quot;slug&quot;: &quot;partners&quot;, &quot;content&quot;: &quot;&lt;h3&gt;&lt;strong&gt;Help turn underground innovation into real projects&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;Underground Innovation Hackathon is built together with organisations that want to turn underground opportunities into practical, scalable solutions.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;Founding partners&lt;/strong&gt;&lt;/h3&gt;&lt;figure class=\&quot;image image_resized image-style-align-right\&quot; style=\&quot;width:50%;\&quot;&gt;&lt;a href=\&quot;https://eis.ee/en\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;&lt;img loading=\&quot;lazy\&quot; src=\&quot;https://assets-live.eventornado.com/upload/iIUqDngSN203BG9TCr8Shb2Q82fWqZxjovlmhpAV.png\&quot;&gt;&lt;/a&gt;&lt;/figure&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;h4&gt;&amp;nbsp;&lt;/h4&gt;&lt;h4&gt;&lt;a href=\&quot;https://eis.ee/en\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Enterprise Estonia / EIS&lt;/a&gt;&amp;nbsp;&lt;/h4&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;figure class=\&quot;image image_resized image-style-align-right\&quot; style=\&quot;width:50%;\&quot;&gt;&lt;a href=\&quot;https://www.egt.ee/en\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;&lt;img loading=\&quot;lazy\&quot; src=\&quot;https://assets-live.eventornado.com/upload/a5xlCBW1YwaoinXWgPz1jzM0cGPsjNjrNpd2GxWy.png\&quot;&gt;&lt;/a&gt;&lt;/figure&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;h4&gt;&lt;a href=\&quot;https://www.egt.ee/en\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;Estonian Geological Survey&lt;/a&gt;&lt;/h4&gt;&lt;figure class=\&quot;image image_resized image-style-align-right\&quot; style=\&quot;width:50%;\&quot;&gt;&lt;a href=\&quot;https://zeroterrain.com/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;&lt;img loading=\&quot;lazy\&quot; src=\&quot;https://assets-live.eventornado.com/upload/ZECYA0qr3HdWRuNWp7ZyUekDsaW4cy7dFN6F3EnO.png\&quot;&gt;&lt;/a&gt;&lt;/figure&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;h4&gt;&lt;a href=\&quot;https://zeroterrain.com/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener noreferrer\&quot;&gt;ZeroTerrain&lt;/a&gt;&lt;/h4&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;h3&gt;&amp;nbsp;&lt;/h3&gt;&lt;h3&gt;&amp;nbsp;&lt;/h3&gt;&lt;h3&gt;&lt;strong&gt;Become a partner&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;We welcome companies, universities, public organisations, investors and industry networks.&lt;/p&gt;&lt;p&gt;Partners can contribute:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Technical expertise and relevant data or use cases.&lt;/li&gt;&lt;li&gt;Mentors and jury members.&lt;/li&gt;&lt;li&gt;International outreach and participant recruitment.&lt;/li&gt;&lt;li&gt;Prizes, technology or services.&lt;/li&gt;&lt;li&gt;Potential pilot projects and follow-up partnerships.&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;&lt;strong&gt;Why join?&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;Connect with international teams, discover emerging solutions and help shape concepts that could develop into future projects.&lt;/p&gt;&lt;p&gt;Partners gain visibility as part of the hackathon and opportunities to engage with teams, experts and potential technology and industry partners.&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;Interested in partnering?&lt;/strong&gt;&lt;br&gt;Contact us at &lt;a href=\&quot;mailto:underground@eis.ee\&quot;&gt;underground@eis.ee&lt;/a&gt;&lt;/h3&gt;&quot;, &quot;icon&quot;: &quot;handshake&quot;, &quot;status&quot;: 1, &quot;created_at&quot;: &quot;2098-09-07T15:09:49.000000Z&quot;, &quot;updated_at&quot;: &quot;2098-11-02T19:27:34.000000Z&quot;, &quot;deleted_at&quot;: null}], &quot;event_groups&quot;: []}'></event-page>
