<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Loops House","item":"https://www.loops.house/"},{"@type":"ListItem","position":2,"name":"Hackathons","item":"https://www.loops.house/builder-arena"},{"@type":"ListItem","position":3,"name":"Agents Open for Business","item":"https://www.loops.house/agents-open-for-business"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Event","name":"Agents Open for Business","description":"Build agents that do real jobs, where the world's money meets local markets.","url":"https://www.loops.house/agents-open-for-business","eventStatus":"https://schema.org/EventScheduled","startDate":"2099-11-20T14:00:00+00:00","endDate":"2099-12-07T09:00:00+00:00","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://www.loops.house/agents-open-for-business"},"image":["https://ennlvrjxpqexvgfhfiaw.supabase.co/storage/v1/object/public/media/hackathon-banners/agents-open-for-business/081f3b11-6ee2-476a-b844-260eddb7f3c1.jpg"],"isAccessibleForFree":true,"offers":{"@type":"Offer","price":0,"priceCurrency":"USD","availability":"https://schema.org/InStock","url":"https://www.loops.house/agents-open-for-business"},"organizer":{"@type":"Organization","name":"Loops House"},"sponsor":[{"@type":"Organization","name":"Stablecoin Corridors | Textile FX","logo":"https://ennlvrjxpqexvgfhfiaw.supabase.co/storage/v1/object/public/media/sponsor-logos/agents-open-for-business/stablecoin-corridors/4ee47ffd-5946-49b2-b3f1-31b50aed3427.jpg"},{"@type":"Organization","name":"Online & Onchain Checkout | Agent Vault","logo":"https://ennlvrjxpqexvgfhfiaw.supabase.co/storage/v1/object/public/media/sponsor-logos/agents-open-for-business/agent-vault/e28d1a04-5972-4671-b541-f4c09e01dad9.png"},{"@type":"Organization","name":"Verified Agent Payments | Self Agent ID","logo":"https://ennlvrjxpqexvgfhfiaw.supabase.co/storage/v1/object/public/media/sponsor-logos/agents-open-for-business/self-agent-id/87283196-411d-413f-b9c9-d5120ea33a7a.png"},{"@type":"Organization","name":"Agent Wallets | Altana","logo":"https://ennlvrjxpqexvgfhfiaw.supabase.co/storage/v1/object/public/media/sponsor-logos/agents-open-for-business/altana/2aa082f0-8304-4b96-afc1-cd588f304559.png"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What are the rules?","acceptedAnswer":{"@type":"Answer","text":"The full list is under Rules on the About page. In short: (1) Celo mainnet only; testnet references in your repo are fine. (2) Every entry registers its agent on ERC-8004; Self Agent ID is recommended. (3) Public GitHub repo at registration that still resolves at judging. (4) Attribution tag in every transaction you want counted; x402 sellers also register their PayTo address. (5) Code is written during the hackathon, from 20 Nov. (6) Enter as many tracks as you want; a project can win in up to two tracks, with one placement per track. (7) Sponsored gas is not a builder contribution."}},{"@type":"Question","name":"How are winners decided?","acceptedAnswer":{"@type":"Answer","text":"The full breakdown is under How winners are decided on the About page.\n(1) Stablecoin Corridors and Altana Agent Wallets: quality of execution, a clear value proposition, initial traction with tagged onchain activity, and a named user with a real job done, 25% each. \n(2) Agent Vault and Self Agent ID: quality of the integration 30%, innovation and value proposition 30%, a named user and a real job done 25%, real use 15%. \n(3) Each track has its own requirements; a project that misses one is not scored in that track. \n(4) Celo DevRel shortlists from onchain data and the Loops judge's reading of your repo. \n(5) Textile and Celo Core Co. judge Stablecoin Corridors, Self judges the Agent Vault and Self Agent ID tracks, and Altana judges the Altana track."}},{"@type":"Question","name":"What counts as an independent user?","acceptedAnswer":{"@type":"Answer","text":"A wallet outside your team and not funded by you or your main funder. New and existing Celo users both count. An agent wallet with its own ERC-8004 identity, registered by a different team, also counts when it pays you. Liquidity pools, routers, Textile makers and exchange wallets do not count. Arbitrage and self-trading score zero. We review activity before judging, so real use gets the credit."}},{"@type":"Question","name":"What is buy, and do I need it?","acceptedAnswer":{"@type":"Answer","text":"buy (usebuy.ai) is Celo Core Co.'s agent service marketplace: compute, blockchain, data, and browser access, paid per request in stablecoins from one wallet. It is optional, but paid calls from your agent to services on buy count in your favour as real use in every track. Install with npm install -g @celo/buy (Node 22+). Docs: usebuy.ai/docs."}},{"@type":"Question","name":"What is ERC-8004, and why do I need it?","acceptedAnswer":{"@type":"Answer","text":"ERC-8004 is the agent identity registry. Your agent gets an onchain ID showing it exists and who owns it, so others can check it before transacting. It takes a few minutes and is required in every track. Guide: docs.celo.org/build-on-celo/build-with-ai/8004. Explore registered agents on 8004scan (8004scan.io)."}},{"@type":"Question","name":"Do I need a Self Agent ID?","acceptedAnswer":{"@type":"Answer","text":"It is required in the Self Agent ID track and recommended everywhere else. It links your agent to a real, unique person with passport proof, without sharing who that person is. Check that your document is supported: docs.self.xyz/docs/self-enterprise/reference/supported-countries."}},{"@type":"Question","name":"What is an attribution tag, and where does it go?","acceptedAnswer":{"@type":"Answer","text":"A short ERC-8021 code your app appends to the calldata of every transaction it sends. It is how we know a transaction came from you. Setup guide and code: github.com/celo-org/attribution-tags. It goes in the code that builds and sends transactions (usually your frontend or agent backend), not in your smart contract. It cannot be added later, so set it up before your first transaction. For Textile FX, request quotes with your wallet (no API key needed) and append your tag to transactions.swap.data before you send it; if you use a Textile API key, leave includeAttribution off so your tag is the only one. x402 payments do not carry tags yet: register your PayTo address at sign-up instead."}},{"@type":"Question","name":"What is Celo's native x402 facilitator?","acceptedAnswer":{"@type":"Answer","text":"x402 is an open standard that turns HTTP 402 into a payment step: the server answers with a price, the client signs a stablecoin authorisation, and the request is retried with payment attached. Celo's hosted facilitator at x402.celo.org settles 10 stablecoins: three dollar stablecoins (USDC, USD₮, USA₮) and seven local currencies (wARS, wBRL, wMXN, wCOP, wPEN, wCLP, cNGN); each service chooses which of these it accepts. Sellers connect a wallet at x402.celo.org to get an API key. New accounts get up to 100 free settlement credits on mainnet (may require a GitHub sign-in) and 1,000 on testnet; after that, each settlement costs gas at cost plus 0.3% of the amount settled, paid from a prepaid balance. Integration guide: x402.celo.org/skill.md."}},{"@type":"Question","name":"Can I enter more than one track?","acceptedAnswer":{"@type":"Answer","text":"Yes. One project can enter all four tracks if it meets each track's requirements. A project can win in up to two tracks, with one placement per track. In the Altana track, the same project can win a use-case prize and earn review XP, with one review per team."}},{"@type":"Question","name":"Do I need to spend real money on Agent Vault checkouts?","acceptedAnswer":{"@type":"Answer","text":"Not on a card. Signing in to a regular website through Agent Vault meets the track requirement, so a card checkout is optional. A checkout on a real website is a real purchase, so if you do one, keep it low value. Agent Vault fills forms with mock tokens, so your agent never sees the real card or password. The x402 payment the track asks for can be a small per-request payment in stablecoins."}},{"@type":"Question","name":"How are prizes paid?","acceptedAnswer":{"@type":"Answer","text":"Prizes are set in USD and paid in CELO at the USD equivalent to the payout wallet you register. Altana XP is credited by Altana directly to the Altana wallet each winner built with (the address registered on the Keystore), not to a separate payout wallet. It shows on xp.altana.network with no claim step."}},{"@type":"Question","name":"What is Altana XP?","acceptedAnswer":{"@type":"Answer","text":"An onchain-verified score for building and interacting with Altana agent wallets. Builders earn it from real wallet activity, and it sets their level on the public leaderboard at xp.altana.network. In this hackathon, the Altana track's use-case prizes and selected product reviews (5,000 XP each, up to 10, one per team) also earn XP. Terms: xp.altana.network/rules."}},{"@type":"Question","name":"Where do I get stablecoins to build with?","acceptedAnswer":{"@type":"Answer","text":"Start with Celopedia (celopedia.celo.org), the library for building on Celo, which covers the stablecoins on Celo and where to get them. Ripio's wFIAT tokens are live on Celo mainnet, with on- and off-ramps at ramp.ripio.com. cNGN is at cngn.co. Textile FX converts USD₮ to and from cNGN, IDRX and wFIAT."}},{"@type":"Question","name":"My users are new to Celo. Does that disqualify me?","acceptedAnswer":{"@type":"Answer","text":"No. New users are welcome. Tell us in your submission who they are and how you reached them."}},{"@type":"Question","name":"I sponsor gas for my users. Will they still be counted?","acceptedAnswer":{"@type":"Answer","text":"Yes. We count signers and authorisers, not only gas payers. Gas your relayer pays does not count as your contribution, so describe this architecture in your submission."}},{"@type":"Question","name":"Do I have to use a particular agent framework?","acceptedAnswer":{"@type":"Answer","text":"No. Any framework works. What matters is what happens onchain and whether a real person uses it."}},{"@type":"Question","name":"I am registering late. Is it worth it?","acceptedAnswer":{"@type":"Answer","text":"Yes. Register, add your attribution tag, and register your PayTo address before sending anything you want counted."}},{"@type":"Question","name":"What if something in my project looks wrong?","acceptedAnswer":{"@type":"Answer","text":"We raise it with you privately, and you have 48 hours to reply before anything is said publicly. Nobody is disqualified by a dashboard. Tell us in your submission where your users and volume came from."}},{"@type":"Question","name":"What happens after the hackathon?","acceptedAnswer":{"@type":"Answer","text":"Winners and projects with real users get co-marketing, mentorship, and ecosystem introductions to keep growing on Celo. Self features winning teams on its X and blog. Each hackathon is one step in a builder's journey on Celo: your track record here counts when you apply for Prezenti Grants (prezenti.xyz). Prezenti's Frontier pool has $45,000 for AI and agent infrastructure on Celo, with grants of up to $15,000; applications are open at frontier.prezenti.xyz until 29 Dec. Office hours and the next hackathon keep the support going."}},{"@type":"Question","name":"Where can I get support?","acceptedAnswer":{"@type":"Answer","text":"Join the hackathon Telegram group (t.me/celoagenthackathons), weekly office hours on Thursdays at 12:00 GMT, and the livestreams on X and YouTube. For Agent ID and Agent Vault, Self's Discord (discord.com/invite/selfxyz). For Altana, Altana's Telegram group (t.me/+8nOYcIdypZliYjVh)."}},{"@type":"Question","name":"Where can I find resources?","acceptedAnswer":{"@type":"Answer","text":"Celopedia (celopedia.celo.org): the library for building on Celo · buy (usebuy.ai): Celo Core Co.'s agent service marketplace, docs at usebuy.ai/docs · x402.celo.org: Celo's native x402 facilitator · ERC-8004 (docs.celo.org/build-on-celo/build-with-ai/8004) and 8004scan (8004scan.io) · Attribution tags (github.com/celo-org/attribution-tags) · Textile FX (fx-docs.textilecredit.com) · Ripio wFIAT (ripio.com/es/wfiat) and Ripio ramps (docs.ripio.com/ramps-api) · Agent Vault (docs.agentvault.io) and Self Agent ID (docs.self.xyz/docs/agent-id/overview) · Altana (docs.altana.network) · AskBots (askbots.ai) · Chainstack (chainstack.com) · Celo Docs (docs.celo.org/build-on-celo/build-with-ai/overview)"}}]}</script><script>self.__next_f.push([1, "1:{\"stage\": \"registration_open\", \"renderedAt\": 1795400385542, \"startDate\": \"2099-11-20T14:00:00.000Z\", \"endDate\": \"2099-12-07T09:00:00.000Z\", \"resultsAnnouncedDate\": \"2099-12-11T14:00:00.000Z\", \"registrationDeadline\": \"2099-12-07T09:00:00.000Z\", \"timezone\": \"Europe/London\", \"isEnrolled\": false, \"registrationOff\": false, \"prizePool\": 5000, \"currency\": \"USD\", \"registeredCount\": 107, \"submittedCount\": 4}"])</script>
